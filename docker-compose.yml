version: '3.8'

services:
  web:
    build: .
    container_name: library-container
    restart: always
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      # Point to the postgres container — overrides any DATABASE_URL in .env
      - DATABASE_URL=postgresql+pg8000://postgres:12345@postgres:5432/library
    volumes:
      - /home/shaheer/library-data:/app/data
    depends_on:
      - postgres
      - redis

  arq-worker:
    build: .
    container_name: library-worker
    restart: always
    command: arq app.worker.worker.WorkerSettings
    env_file:
      - .env
    environment:
      - REDIS_URL=redis://redis:6379/0
      - DATABASE_URL=postgresql+pg8000://postgres:12345@postgres:5432/library
    volumes:
      - /home/shaheer/library-data:/app/data
    depends_on:
      - postgres
      - redis

  postgres:
    image: postgres:15-alpine
    container_name: library-postgres
    restart: always
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=12345
      - POSTGRES_DB=library
    volumes:
      - /home/shaheer/library-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:alpine
    container_name: library-redis
    restart: always
    volumes:
      - /home/shaheer/library-redis-data:/data
    command: redis-server --appendonly yes

  caddy:
    image: caddy:latest
    container_name: caddy
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - web

volumes:
  caddy_data:
  caddy_config: